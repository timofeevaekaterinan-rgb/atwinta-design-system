<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ServiceLine</title>
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:24px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.stack{display:flex;flex-direction:column;gap:24px}
.cap{font-size:12px;line-height:16px;color:var(--ink-muted);letter-spacing:.02em;margin:0 0 8px}
body{padding:0}
</style>
</head>
<body>
<div class="at-service"><span class="at-service__fill"></span><svg class="at-service__dot" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="10" fill="var(--pink)"/></svg><div class="at-service__inner"><div class="at-service__title">Внедрение ИИ</div><div class="at-service__desc"><span>Встраиваем ИИ в процессы бизнеса</span></div></div></div>
<div class="at-service is-hover"><span class="at-service__fill"></span><svg class="at-service__dot" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="10" fill="var(--pink)"/></svg><div class="at-service__inner"><div class="at-service__title">Разработка</div><div class="at-service__desc"><span>Доверьте нам разработку сайта, сервиса или приложения: от идеи до внедрения</span></div></div></div>
<div class="at-service"><span class="at-service__fill"></span><svg class="at-service__dot" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="10" fill="var(--pink)"/></svg><div class="at-service__inner"><div class="at-service__title">Дизайн</div><div class="at-service__desc"><span>Интерфейсы на основе аналитики и данных</span></div></div></div>
</body>
</html>
