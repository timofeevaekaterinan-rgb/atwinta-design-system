<!-- @dsCard group="Контент" height=320 subtitle="«Атвинта в цифрах»: Stem с хроматическим сдвигом" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>NumberFact</title>
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:24px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.stack{display:flex;flex-direction:column;gap:24px}
.cap{font-size:12px;line-height:16px;color:var(--ink-muted);letter-spacing:.02em;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 60px}
</style>
</head>
<body>
<div class="grid">
<div class="at-fact at-fact--m"><div class="at-fact__head"><span class="at-fact__value">100</span><span class="at-fact__unit">сотрудников</span></div><p class="at-fact__desc" style="margin:0">Аналитики, дизайнеры, разработчики и тестировщики, готовые подхватить любой объем задач</p></div>
<div class="at-fact at-fact--m"><div class="at-fact__head"><span class="at-fact__value">400+</span><span class="at-fact__unit">проектов</span></div><p class="at-fact__desc" style="margin:0">Партнеры крупного и среднего бизнеса, создаем клиентские сервисы и масштабные экосистемы</p></div>
</div>
</body>
</html>
