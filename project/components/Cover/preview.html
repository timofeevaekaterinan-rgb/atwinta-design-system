<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Атвинта</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .pink { fill:var(--pink); }
  .yellow { fill:var(--yellow); }
  .deep { fill:var(--ink); }
  .cut { fill:var(--pink-dark); }
  .glow { fill:var(--pink-light); }
  .words { position:absolute; left:40px; bottom:40px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:100px; line-height:.95; font-weight:500; letter-spacing:-3px; color:var(--ink); }
  .tag { margin:10px 0 0 4px; font-size:14px; line-height:20px; font-weight:300; letter-spacing:-.3px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      pink 240×288 slab, bled top and bottom (the identity colour, largest) · yellow 224×120 bled off the right · ink 224×152 bled off right and bottom — ≈45% of 960×288
        arrangement one tall pink slab with two satellites, gutter space-xs (20px → 16 at this scale), square corners: cards and sections on the site have no radius
        pattern     pills from radius-pill, rotated −45°: the hero's glossy pink 3D slabs and the capsule buttons are the brand's one recurring shape; six pills, cut into the slab in pink-dark and pink-light, one pink pill on the ink block, one pink-dark pill on the yellow
        scales      pill height space-md (40px), rx = half of it; pitch space-lg (60px); gutters space-xs
      -->
      <rect class="pink" x="0" y="-8" width="240" height="304"/>
      <rect class="yellow" x="256" y="0" width="232" height="120"/>
      <rect class="deep" x="256" y="136" width="232" height="160"/>
      <g transform="rotate(-45 120 144)">
        <rect class="cut" x="-10" y="64" width="150" height="40" rx="20"/>
        <rect class="glow" x="60" y="124" width="190" height="40" rx="20"/>
        <rect class="cut" x="0" y="184" width="130" height="40" rx="20"/>
        <rect class="glow" x="120" y="244" width="110" height="40" rx="20"/>
      </g>
      <rect class="pink" x="300" y="196" width="140" height="40" rx="20" transform="rotate(-45 370 216)"/>
      <rect class="cut" x="330" y="30" width="110" height="40" rx="20" transform="rotate(-45 385 50)"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Атвинта</h1>
    <p class="tag">ИИ-разработка цифровых продуктов</p>
  </div>
</div>
</body>
</html>
